# 性能评估系统配置文件示例
# 复制此文件为 config.yaml 并根据需要修改配置

# 日志级别：debug, info, warn, error
log_level: info

# 输出格式：text, json
output_format: text

# 综合评分权重，四项都需要配置，数值会按已成功测试自动归一化
score_weights:
  cpu: 0.30
  memory: 0.20
  disk: 0.25
  network: 0.25

# 数据采集间隔（秒）
collection_interval: 60

# GeoIP 数据库文件路径（可选）
# 如果不需要地理位置识别功能，可以留空
geoip_db_path: ""

# 磁盘测试后端：builtin, fio
disk_backend: builtin

# CPU 测试后端：builtin, sysbench
cpu_backend: builtin

# 内存测试后端：builtin, sysbench
memory_backend: builtin

# 网络测试后端：builtin, iperf3
# builtin 为当前内置 HTTP/TCP 测试；iperf3 用于真实吞吐测试
network_backend: builtin

# iperf3 服务端地址，仅在 network_backend=iperf3 时使用
iperf3_server: ""

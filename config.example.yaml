# 性能评估系统配置文件示例
# 复制此文件为 config.yaml 并根据需要修改配置

# 日志级别：debug, info, warn, error
log_level: info

# 输出格式：json, text
output_format: json

# 数据采集间隔（秒）
collection_interval: 60

# GeoIP 数据库文件路径（可选）
# 如果不需要地理位置识别功能，可以留空
geoip_db_path: ""

# 网络测试后端：builtin, iperf3
# builtin 为当前内置 HTTP/TCP 测试；iperf3 后端目前为预留入口
network_backend: builtin

# iperf3 服务端地址，仅在 network_backend=iperf3 时使用
iperf3_server: ""

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate
        run: make validate
      
      - name: Get version
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="${{ github.event.inputs.version }}"
          fi
          if [[ ! "$version" =~ ^v[0-9]+(\.[0-9]+){2}([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
      
      - name: Build binaries
        run: |
          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.Version=${{ steps.get_version.outputs.VERSION }}" -o perfassess_linux_amd64 cmd/main.go
          
          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X main.Version=${{ steps.get_version.outputs.VERSION }}" -o perfassess_linux_arm64 cmd/main.go
          
          # macOS amd64
          GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X main.Version=${{ steps.get_version.outputs.VERSION }}" -o perfassess_darwin_amd64 cmd/main.go
          
          # macOS arm64
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.Version=${{ steps.get_version.outputs.VERSION }}" -o perfassess_darwin_arm64 cmd/main.go
          
          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X main.Version=${{ steps.get_version.outputs.VERSION }}" -o perfassess.exe cmd/main.go

          sha256sum perfassess_linux_amd64 perfassess_linux_arm64 perfassess_darwin_amd64 perfassess_darwin_arm64 perfassess.exe > checksums.txt
          mkdir -p build
          cp perfassess_linux_amd64 perfassess_linux_arm64 perfassess_darwin_amd64 perfassess_darwin_arm64 perfassess.exe checksums.txt build/
          scripts/release-checksums-smoke.sh build

      - name: Smoke test release binary
        run: |
          chmod +x perfassess_linux_amd64
          scripts/release-smoke.sh ./perfassess_linux_amd64
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: ${{ steps.get_version.outputs.VERSION }}
          files: |
            perfassess_linux_amd64
            perfassess_linux_arm64
            perfassess_darwin_amd64
            perfassess_darwin_arm64
            perfassess.exe
            checksums.txt
          body: |
            ## 安装方法
            
            ### 一键测评（Linux/macOS）
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/bootstrap.sh | bash
            ```
            
            ### 手动下载
            1. 下载对应平台的二进制文件
            2. 添加执行权限：`chmod +x perfassess_*`
            3. 移动到系统路径：`sudo mv perfassess_* /usr/local/bin/perfassess`
            
            ### 快速开始
            ```bash
            # 默认一把梭，生成控制台、Markdown、JSON 和压缩包报告
            perfassess
            
            # 快速预设
            perfassess --quick
            ```

            报告默认输出到 `/tmp/perfassess-auto/`；如需实时 Web 页面，可使用：
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/bootstrap.sh | bash -s -- --web --port 8080
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

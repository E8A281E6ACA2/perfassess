name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test And Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./... -count=1

      - name: Build
        run: go build ./...

      - name: CLI help smoke
        run: go run ./cmd --help

      - name: Dependency check smoke
        run: go run ./cmd check-deps

      - name: Validate sample JSON report
        run: go test ./internal/reporter -run TestReportJSONSampleContract -count=1
